name: evalution
description: Test your agent, and fail the pull request only when something got worse.
inputs:
  config:
    description: Your evalution config
    default: evalution.yaml
  target:
    description: The app to test, as named in the config
    required: true
  set:
    description: The test set
    default: main
  baseline:
    description: A saved run to compare with (made with `evalution run --save`). Left out, any test that doesn't pass fails.
    default: ""
  tries:
    description: Tries per test, instead of each test's own
    default: ""
  page:
    description: Where this run can be opened on an evalution page, to link each test. Left out, tests are only named.
    default: ""
  token:
    description: "Keeps one comment on the pull request up to date: needs `pull-requests: write`"
    default: ${{ github.token }}
  server:
    description: A hosted evalution. Given, the run plays its workspace's tests and is uploaded there; left out, it plays the repo's `sets/`.
    default: ""
  server-token:
    description: "With `server`: a workspace API token (`evt_...`), from a secret"
    default: ""
  env:
    description: Where the app runs, e.g. `ci`, to tell its runs apart from the app's elsewhere
    default: ""
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - shell: bash
      env:
        EVALUTION_CONFIG: ${{ inputs.config }}
        EVALUTION_TARGET: ${{ inputs.target }}
        EVALUTION_SET: ${{ inputs.set }}
        EVALUTION_BASELINE: ${{ inputs.baseline }}
        EVALUTION_TRIES: ${{ inputs.tries }}
        EVALUTION_PAGE: ${{ inputs.page }}
        EVALUTION_SERVER: ${{ inputs.server }}
        EVALUTION_TOKEN: ${{ inputs.server-token }}
        EVALUTION_ENV: ${{ inputs.env }}
        EVALUTION_SOURCE: ${{ github.action_path }}/server
        EVENT: ${{ github.event_name }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        summary="$RUNNER_TEMP/evalution-summary.md"
        rm -f "$summary"
        args=(--config "$EVALUTION_CONFIG" run --target "$EVALUTION_TARGET" --set "$EVALUTION_SET" --yes)
        if [ -n "$EVALUTION_SERVER" ]; then
          # The workspace's tests, and the run uploaded there; the token is read from the env.
          args+=(--server "$EVALUTION_SERVER")
        else
          # The repo's tests (the config's sets_dir) into the job's fresh database first.
          args+=(--sets)
        fi
        if [ -n "$EVALUTION_ENV" ]; then args+=(--env "$EVALUTION_ENV"); fi
        if [ -n "$EVALUTION_BASELINE" ]; then
          args+=(--against "$EVALUTION_BASELINE" --summary "$summary")
          if [ -n "$EVALUTION_PAGE" ]; then args+=(--page "$EVALUTION_PAGE"); fi
        fi
        if [ -n "$EVALUTION_TRIES" ]; then args+=(--tries "$EVALUTION_TRIES"); fi
        status=0
        uvx --from "$EVALUTION_SOURCE" evalution "${args[@]}" || status=$?

        # The comparison, when there was one: always in the job's summary, and on a pull request
        # as one comment, found again by its marker and edited in place on every run.
        if [ -s "$summary" ]; then
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR" ]; then
            marker="<!-- evalution -->"
            body="$RUNNER_TEMP/evalution-comment.md"
            { echo "$marker"; cat "$summary"; } > "$body"
            ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
              --jq ".[] | select(.body | startswith(\"$marker\")) | .id") || ids=""
            id="${ids%%$'\n'*}"
            if [ -n "$id" ]; then
              gh api --silent -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" \
                || echo "::warning::evalution couldn't update its pull request comment"
            else
              gh api --silent "repos/$REPO/issues/$PR/comments" -F "body=@$body" \
                || echo "::warning::evalution couldn't comment on the pull request"
            fi
          fi
        fi
        exit "$status"
