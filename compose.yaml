# evalution alone, on 127.0.0.1:8080. Before the first `docker compose up --build`:
#   cp evalution.example.yaml evalution.yaml && mkdir -p data sets targets backups
# Your apps are outside this container: in evalution.yaml, address one on this computer as
# host.docker.internal. Phoenix isn't in the image, so set `traces: {managed: builtin}` or point the
# target at a Phoenix of your own, and to connect a project by its folder, mount it here too.
# Secrets don't go in this file: put them in .env, which is git-ignored and is read if it's there.
# Hosted, on Postgres with sign-in: `COMPOSE_PROFILES=hosted` and the rest in .env (docs/deploy.md).
services:
  evalution:
    build: {context: ., dockerfile: server/Dockerfile}
    # On Linux, the owner of the folders below (`id -u`, `id -g`) if that isn't 1000.
    user: "${EVALUTION_UID:-1000}:${EVALUTION_GID:-1000}"
    # No login. Publishing on 127.0.0.1 keeps other computers out, not this one's programs: anything
    # running here can reach the port. The server inside listens on all of the container's addresses
    # (and warns that it does), and answers only under the names in EVALUTION_ALLOWED_HOSTS, which
    # keeps out a web page on another site that points its own name at this computer.
    ports: ["127.0.0.1:8080:8080"]
    env_file:
      - {path: .env, required: false}
    environment:
      EVALUTION_ALLOWED_HOSTS: ${EVALUTION_ALLOWED_HOSTS:-localhost,127.0.0.1}
    # Hosted only: waits for the database, which isn't there without the profile.
    depends_on:
      postgres: {condition: service_healthy, required: false}
    volumes:
      - {type: bind, source: ./evalution.yaml, target: /app/evalution.yaml, read_only: true, bind: {create_host_path: false}}
      - ./sets:/app/sets
      - ./targets:/app/targets
      - ./data:/app/data
      - ./backups:/app/backups
    healthcheck:
      # No proxy, whatever .env says: this asks the server next to it.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8080/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]

  # Where a hosted evalution keeps everything, given DATABASE_URL=postgresql://evalution:<password>@postgres:5432/evalution.
  postgres:
    profiles: [hosted]
    image: postgres:17.10
    environment:
      # From .env, and the same in DATABASE_URL; with none, Postgres won't start.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_USER: evalution
      POSTGRES_DB: evalution
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, evalution, -d, evalution]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres:
