<!doctype html>
<html lang="en" data-font="geist">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>evalution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Hallmark · genre: modern-minimal · macrostructure: app workbench · theme: custom "warm paper, evalution violet"
 * one family (Geist) + Geist Mono for machine text · pre-emit critique: P5 H5 E4 S5 R4 V4
 * sample data: cartly, a made-up shopping assistant. Nothing is wired. */
:root{
  color-scheme:light;
  --font-ui:"Geist",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:"Geist Mono","SF Mono",ui-monospace,Menlo,monospace;
  --window:#f8f7f4; --group:#ffffff; --sunk:#f3f1ed; --sunk-2:#e8e5df;
  --rule:#ebe8e2; --rule-strong:#d6d2ca;
  --ink:#191820; --ink-2:#514f5b; --ink-3:#827f8a;
  --tint:#5546d8; --tint-hover:#4638bd; --tint-2:#8b7ff0; --tint-soft:#f0eefc; --tint-soft-2:#dedafa; --tint-ink:#4336b8; --on-tint:#ffffff;
  --pass:#17806a; --pass-soft:#e1f2ec; --fail:#c2372a; --fail-soft:#fbeae6; --fail-line:#f1c4bd;
  --unj:#a86c00; --unj-soft:#fbf0d9;
  --k-tool:#0b8577; --k-tool-soft:#dcf3ef; --k-agent:#3b6fd9; --k-agent-soft:#e6edfb;
  --shadow:rgba(40,34,20,.07); --shadow-2:rgba(40,34,20,.16); --scrim:rgba(25,24,32,.36);
  --ease:cubic-bezier(.2,.7,.2,1);
}
html[data-font="inter"]{--font-ui:"Inter",system-ui,sans-serif}
html[data-font="plex"]{--font-ui:"IBM Plex Sans",system-ui,sans-serif}
html[data-theme="dark"]{
  color-scheme:dark;
  --window:#0e0f14; --group:#17181f; --sunk:#1f2029; --sunk-2:#2b2c38;
  --rule:rgba(255,255,255,.08); --rule-strong:rgba(255,255,255,.17);
  --ink:#f0eff4; --ink-2:#b6b4c0; --ink-3:#8b8996;
  --tint:#8c9bff; --tint-hover:#a3afff; --tint-2:#b3a8ff; --tint-soft:#23264a; --tint-soft-2:#343a66; --tint-ink:#b9c1ff; --on-tint:#0e0f14;
  --pass:#2dd4bf; --pass-soft:#103a35; --fail:#ff8577; --fail-soft:#40201c; --fail-line:#6b2e27;
  --unj:#f0b65a; --unj-soft:#3a2a14;
  --k-tool:#2dd4bf; --k-tool-soft:#103a35; --k-agent:#7da7ff; --k-agent-soft:#1c2a4a;
  --shadow:rgba(0,0,0,.35); --shadow-2:rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;overflow-x:clip}
body{background:var(--window);color:var(--ink);font:400 15px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px} svg.i.f{fill:currentColor;stroke:none;width:12px;height:12px}
.mono{font-family:var(--font-mono);font-size:13px}
.dim{color:var(--ink-3)} .ink2{color:var(--ink-2)} .bad{color:var(--fail)} .good{color:var(--pass)}
h1{margin:0;font:600 28px/1.15 var(--font-ui);letter-spacing:-.025em;overflow-wrap:anywhere;min-width:0}
h2{margin:0;font:600 15px/1.3 var(--font-ui);letter-spacing:-.005em}
h3{margin:0;font:500 13px/1.3 var(--font-ui);color:var(--ink-3)}
p{margin:0}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
body.asking .shell{grid-template-columns:240px minmax(0,1fr) 420px}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;border-right:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;font:600 18px/1 var(--font-ui);letter-spacing:-.03em}
.mark{width:28px;height:28px;flex:none;display:block}
.mark path{fill:var(--tint);stroke:var(--tint);stroke-width:3;stroke-linejoin:round}
.mark .eye{fill:var(--group);transform-box:fill-box;transform-origin:center;animation:wink 5s infinite}
.appsw{display:flex;align-items:center;gap:10px;width:100%;padding:9px;border:1px solid var(--rule);border-radius:12px;background:var(--group);text-align:left;box-shadow:0 1px 2px var(--shadow)}
.appsw:hover{border-color:var(--rule-strong)}
.av{width:34px;height:34px;border-radius:9px;background:var(--tint-soft);color:var(--tint-ink);display:grid;place-items:center;font-weight:600;flex:none}
.appsw b{display:block;font-weight:600;line-height:1.2}
.appsw small{font:400 12px var(--font-mono);color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.nav .h{font-size:12px;color:var(--ink-3);padding:16px 10px 6px}
.nav button{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border:0;background:none;border-radius:10px;color:var(--ink-2);text-align:left;width:100%;white-space:nowrap}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--tint-soft);color:var(--tint-ink);font-weight:500}
.nav .n{margin-left:auto;font:500 12px var(--font-mono);color:var(--ink-3);padding:1px 7px;border-radius:99px;background:var(--sunk)}
.nav .n.bad{background:var(--fail-soft);color:var(--fail)}
.nav button.on .n:not(.bad){background:var(--group);color:var(--tint-ink)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.nav .copystat,.nav .copystat:hover{background:var(--pass-soft);color:var(--pass)}
.copystat{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border:0;border-radius:10px;background:var(--pass-soft);color:var(--pass);font-size:14px;white-space:nowrap;margin-bottom:6px;width:100%;text-align:left}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;height:60px;padding:0 32px;background:color-mix(in srgb,var(--window) 88%,transparent);backdrop-filter:blur(10px)}
.back{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 6px;border:0;border-radius:9px;background:none;color:var(--ink-2);white-space:nowrap}
.back:hover{background:var(--sunk);color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;height:36px;width:min(320px,34vw);padding:0 12px;border:1px solid var(--rule);border-radius:10px;background:var(--group);color:var(--ink-3);font-size:14px;white-space:nowrap}
.kbd{font:500 11px var(--font-mono);padding:1px 5px;border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:5px;color:var(--ink-3);margin-left:auto}
.live{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:0;border-radius:99px;background:var(--tint-soft);color:var(--tint-ink);font-weight:500;font-size:14px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--tint);animation:pulse 1.6s var(--ease) infinite}
.page{padding:8px 32px 120px;display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%;margin:0 auto}
.page.narrow{max-width:760px}
.head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.head .t{flex:1 1 320px;min-width:0}
.head .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{color:var(--ink-2);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--group);font-weight:500;white-space:nowrap;transition:background .12s var(--ease)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--tint);border-color:var(--tint);color:var(--on-tint)}
.btn.primary:hover{background:var(--tint-hover);border-color:var(--tint-hover)}
.btn.sm{height:32px;padding:0 11px;font-size:14px;border-radius:9px}
.btn.ghost{border-color:transparent;background:none;color:var(--tint-ink);padding:0 8px}
.btn.ghost:hover{background:var(--tint-soft)}
.btn.sq{width:38px;padding:0}.btn.sm.sq{width:32px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--rule);background:var(--group);font-size:13px;color:var(--ink-2);white-space:nowrap}
.chip.tint{border-color:var(--tint-soft-2);background:var(--tint-soft);color:var(--tint-ink)}
.chip.warn{border-color:transparent;background:var(--unj-soft);color:var(--unj)}
.chip.ok{border-color:transparent;background:var(--pass-soft);color:var(--pass)}
.chip.no{border-color:transparent;background:var(--fail-soft);color:var(--fail)}
.chip.mono{font-family:var(--font-mono);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:7px;font:500 13px var(--font-mono);white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.tag.tool{background:var(--k-tool-soft);color:var(--k-tool)} .tag.llm{background:var(--tint-soft);color:var(--tint-ink)} .tag.agent{background:var(--k-agent-soft);color:var(--k-agent)}
.tag.bad{background:var(--fail-soft);color:var(--fail)} .tag.ok{background:var(--pass-soft);color:var(--pass)} .tag.warn{background:var(--unj-soft);color:var(--unj)}
.tag.miss{background:none;box-shadow:inset 0 0 0 1.5px var(--fail);color:var(--fail)}
.tag.never{text-decoration:line-through}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--sunk);gap:2px;max-width:100%;overflow-x:auto}
.seg button{height:32px;padding:0 12px;border:0;border-radius:8px;background:none;color:var(--ink-2);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button.on{background:var(--group);color:var(--ink);box-shadow:0 1px 2px var(--shadow-2)}
.seg .c{font:500 12px var(--font-mono);color:var(--ink-3)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs button{height:44px;padding:0;border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--ink-2);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--tint)}
.field{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:10px;background:var(--group);min-width:0}
.field input{flex:1;min-width:0;border:0;outline:0;background:none}
.field.big{height:56px;font-size:17px;border-radius:14px;padding:0 8px 0 18px;box-shadow:0 2px 10px var(--shadow)}
.field:focus-within{border-color:var(--tint);box-shadow:0 0 0 3px var(--tint-soft)}
.pick{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border:1px solid var(--rule-strong);border-radius:10px;background:var(--group);font-size:14px;white-space:nowrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--rule-strong);border-radius:10px;background:var(--group);height:36px}
.step button{width:34px;height:34px;border:0;background:none;border-radius:9px}
.step b{min-width:26px;text-align:center;font-weight:600}
.sw{position:relative;width:40px;height:24px;border-radius:12px;border:0;background:var(--sunk-2);flex:none;transition:background .15s var(--ease)}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--group);box-shadow:0 1px 2px var(--shadow-2);transition:transform .15s var(--ease)}
.sw.on{background:var(--tint)}.sw.on::after{transform:translateX(16px)}

/* surfaces */
.card{background:var(--group);border:1px solid var(--rule);border-radius:16px;min-width:0;box-shadow:0 1px 2px var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 20px;border-bottom:1px solid var(--rule)}
.card>.hd.nb{border-bottom:0;min-height:0;padding-top:18px}
.card>.bd{padding:20px}
.card.cut{overflow:hidden}
.grid{display:grid;gap:20px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gmain{grid-template-columns:minmax(0,1fr) 340px}
.gwork{grid-template-columns:minmax(0,1fr) 380px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.pass{background:var(--pass)} .dot.fail{background:var(--fail)} .dot.unj{background:var(--unj)} .dot.none{box-shadow:inset 0 0 0 1.5px var(--rule-strong)}
.dot.flaky{background:linear-gradient(90deg,var(--pass) 50%,var(--fail) 50%)}
.dot.go{background:var(--tint);animation:pulse 1.6s var(--ease) infinite}
.list>*{border-top:1px solid var(--rule)} .list>*:first-child{border-top:0}
.item{display:flex;align-items:center;gap:14px;padding:14px 20px;min-width:0}
.item .t{flex:1;min-width:0}
.item b{font-weight:500;display:block}
.item small{font-size:14px;color:var(--ink-2);display:block}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.ico.bad{background:var(--fail-soft);color:var(--fail)} .ico.warn{background:var(--unj-soft);color:var(--unj)} .ico.tint{background:var(--tint-soft);color:var(--tint-ink)} .ico.ok{background:var(--pass-soft);color:var(--pass)} .ico.plain{background:var(--sunk);color:var(--ink-2)}
table{width:100%;border-collapse:collapse}
th{font-size:13px;font-weight:500;color:var(--ink-3);text-align:left;padding:10px 20px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:14px 20px;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
.tw{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.big{font:600 40px/1 var(--font-ui);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.big small{font-size:20px;font-weight:500;color:var(--ink-3);letter-spacing:-.01em}
.delta{font-size:13px;font-weight:500;padding:2px 8px;border-radius:99px;white-space:nowrap}
.delta.bad{background:var(--fail-soft);color:var(--fail)} .delta.ok{background:var(--pass-soft);color:var(--pass)} .delta.flat{background:var(--sunk);color:var(--ink-2)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk-2)}
.bar i{display:block;height:100%}
.meter{height:8px;border-radius:4px;background:var(--sunk-2);overflow:hidden;min-width:40px}
.meter i{display:block;height:100%;background:var(--pass);border-radius:4px;transition:width .5s var(--ease)}
.meter.go i{background:var(--tint)} .meter.weak i{background:var(--unj)}
pre{margin:0;font:400 13px/1.6 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.code{background:var(--sunk);border-radius:10px;padding:12px 14px}
.bubble{display:inline-block;padding:9px 14px;border-radius:16px 16px 16px 5px;background:var(--sunk);max-width:100%}
.bubble.app{background:var(--tint-soft);border-radius:16px 16px 5px 16px}
mark{background:none;color:inherit;border-bottom:2px wavy var(--fail)}
mark.g{border-bottom:2px solid var(--pass)}
.spin{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes wink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.pop{animation:pop .4s var(--ease) both}

/* cells + matrix */
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:150px}
.cells i{height:18px;border-radius:4px;background:var(--sunk-2)}
.cells i.p,.mx i.p{background:var(--pass)} .cells i.f,.mx i.f{background:var(--fail)} .cells i.u,.mx i.u{background:var(--unj)}
.mx{display:grid;gap:5px;align-items:center}
.mx .h{font:400 12px var(--font-mono);color:var(--ink-3);text-align:center}
.mx .h.now{color:var(--tint-ink);font-weight:500}
.mx .nm{font-weight:500;padding-right:14px}
.mx i{height:30px;border-radius:7px;background:var(--sunk-2);min-width:28px;cursor:pointer;transition:transform .12s var(--ease)}
.mx i:hover{transform:scale(1.08)}
.mx i.q{background:repeating-linear-gradient(135deg,var(--tint-soft-2) 0 5px,var(--tint-soft) 5px 10px)}
.playb{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--group);display:grid;place-items:center;padding:0;flex:none}
.playb:hover{background:var(--tint);border-color:var(--tint);color:var(--on-tint)}
.playb svg{margin-left:2px}

/* connect + setup */
.center{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px}
.hero{width:min(680px,100%);display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center}
.hero h1{font-size:40px}
.egs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.egs button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:99px;border:1px solid var(--rule);background:var(--group);font:400 13px var(--font-mono);color:var(--ink-2)}
.egs button:hover{border-color:var(--tint);color:var(--tint-ink)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;margin-top:10px}
.trio div{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;border-radius:14px;background:var(--sunk);color:var(--ink-2);font-size:14px}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stage{position:relative;padding:16px 20px;display:flex;gap:12px;align-items:center;border-right:1px solid var(--rule);min-width:0}
.stage:last-child{border-right:0}
.ring{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--ink-3)}
.stage.done .ring{background:var(--pass-soft);color:var(--pass)}
.stage.doing .ring{background:var(--tint-soft);color:var(--tint-ink)}
.stage b{display:block;font-weight:600;line-height:1.25}
.stage small{color:var(--ink-3);font:400 12px var(--font-mono);white-space:nowrap}
.stage .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--pass);width:0;transition:width .6s var(--ease)}
.stage.doing .fill{background:var(--tint)}
.feed{display:flex;flex-direction:column;padding:8px 0;height:384px;overflow:auto}
.fl{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 20px}
.fl .m{font:400 13px var(--font-mono);color:var(--ink-3)}
.pic{display:grid;grid-template-columns:minmax(0,.8fr) 36px minmax(0,1.3fr);padding:20px;align-items:stretch}
.box{border:1.5px dashed var(--rule-strong);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:176px}
.box.copy{border:2px solid var(--tint);background:var(--tint-soft)}
.box.copy.ok{border-color:var(--pass);background:var(--pass-soft)}
.box h3{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.blk{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:10px;background:var(--group);border:1px solid var(--rule);font-size:14px;min-width:0}
.box:not(.copy) .blk{background:var(--sunk);color:var(--ink-3)}
.blk small{margin-left:auto;font:400 12px var(--font-mono);color:var(--ink-3);white-space:nowrap}
.arrow{display:grid;place-items:center;color:var(--ink-3)}
.outs{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 20px;align-items:center}
.out{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:99px;font-size:13px;border:1px solid var(--rule);white-space:nowrap}
.out.off{color:var(--fail);border-color:transparent;background:var(--fail-soft)}
.out.off span{text-decoration:line-through}

/* map */
.map{width:100%;height:auto;display:block}
.map .n{cursor:pointer}
.map .n rect{fill:var(--group);stroke:var(--rule-strong);stroke-width:1.2}
.map .n:hover rect{stroke:var(--tint)}
.map .n.agent rect{fill:var(--ink);stroke:var(--ink)}
.map .n.agent text{fill:var(--group)}
.map .n.store rect{fill:var(--sunk)}
.map .n.new rect{stroke:var(--tint);stroke-dasharray:5 4;fill:var(--tint-soft)}
.map .n.unseen rect{stroke-dasharray:4 4}
.map .n.sel rect{stroke:var(--tint);stroke-width:2.5}
.map text{font:500 14px var(--font-ui);fill:var(--ink)}
.map text.s{font:400 11.5px var(--font-mono);fill:var(--ink-3)}
.map path{fill:none;stroke:var(--rule-strong);stroke-width:1.5}
.map path.hot{stroke:var(--k-tool);stroke-width:3.5}
.map path.cold{stroke-dasharray:3 5}
.map text.c{font:500 12px var(--font-mono);fill:var(--ink-3)}
.ev{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:6px;font:400 12px var(--font-mono);background:var(--sunk);color:var(--ink-2)}

/* result */
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:20px;align-items:center}
.vbig{font:600 22px/1.2 var(--font-ui);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.layers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule)}
.layer{padding:14px 20px;border-right:1px solid var(--rule);min-width:0}
.layer:last-child{border-right:0}
.layer b{display:flex;align-items:center;gap:8px;font-weight:600}
.layer small{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.layer.fail{background:var(--fail-soft)}
.tl{position:relative;padding:8px 0}
.ts{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr);cursor:pointer}
.ts:hover{background:var(--sunk)}
.ts.sel{background:var(--tint-soft)}
.ts.badrow{background:var(--fail-soft)}
.ts.badrow.sel{box-shadow:inset 4px 0 0 var(--fail)}
.ts .gut{position:relative;display:flex;justify-content:center;padding-top:16px}
.ts .gut::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--rule)}
.ts:first-child .gut::before{top:20px} .ts:last-child .gut::before{bottom:calc(100% - 20px)}
.ts .gut i{position:relative;width:14px;height:14px;border-radius:50%;background:var(--group);border:2px solid var(--rule-strong)}
.ts .gut i.pass{border-color:var(--pass);background:var(--pass)} .ts .gut i.fail{border-color:var(--fail);background:var(--fail)} .ts .gut i.sq{border-radius:4px}
.ts .bdy{padding:12px 20px 12px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.ts .k{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.ts .k .at{margin-left:auto;font:400 12px var(--font-mono)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);gap:8px;align-items:center}
.pair h3{font-size:12px}
.thumb{width:132px;aspect-ratio:16/10;border-radius:9px;border:1px solid var(--rule);background:var(--sunk);position:relative;overflow:hidden;flex:none}
.thumb::before{content:"";position:absolute;inset:0 0 auto 0;height:16%;background:var(--sunk-2)}
.thumb i{position:absolute;left:12%;right:30%;height:8%;border-radius:4px;background:var(--sunk-2)}
.thumb i.me{left:40%;right:8%;background:var(--tint-soft-2)}
.thumb.bad{border-color:var(--fail);box-shadow:0 0 0 3px var(--fail-soft)}
.thumb .hole{position:absolute;left:12%;right:30%;top:58%;height:18%;border:2px dashed var(--fail);border-radius:5px}
.thumb.vid{background:var(--ink);display:grid;place-items:center;color:var(--group)}

.film{display:flex;gap:12px;overflow-x:auto;padding:20px}

.wf{display:flex;flex-direction:column;gap:2px;padding:12px 8px}

.wfr:hover{background:var(--sunk)} .wfr.sel{background:var(--tint-soft)}
.wfr .trk{position:relative;height:10px;border-radius:5px;background:var(--sunk)}
.wfr .trk i{position:absolute;top:0;bottom:0;border-radius:5px;min-width:4px}
.wfr b{font:400 12px var(--font-mono);color:var(--ink-3);text-align:right}
.ctxbar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--sunk-2)}
.ctxbar i{display:block;height:100%}
.sq{display:inline-block;width:18px;height:18px;border-radius:5px;background:var(--sunk-2)}
.sq.p{background:var(--pass)} .sq.f{background:var(--fail)} .sq.fl{background:linear-gradient(90deg,var(--pass) 50%,var(--fail) 50%)}
.thumbs{display:inline-flex;gap:2px}
.thumbs button{width:28px;height:28px;border:0;border-radius:7px;background:none;color:var(--ink-3);display:grid;place-items:center}
.thumbs button:hover{background:var(--sunk);color:var(--ink)}
.script{position:relative;display:flex;flex-direction:column;gap:12px;padding:20px 20px 20px 48px}
.script::before{content:"";position:absolute;left:27px;top:30px;bottom:30px;width:2px;background:var(--rule)}
.st{position:relative;display:flex;align-items:center;gap:10px;min-height:32px;flex-wrap:wrap}
.st::before{content:"";position:absolute;left:-27px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--group);border:2px solid var(--rule-strong)}
.st.call::before{border-color:var(--k-tool);background:var(--k-tool)}
.st.chk::before{border-radius:4px;border-color:var(--tint)}
.st.never::before{border-color:var(--fail)}
.st.draw{opacity:.6}
.brk{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px;margin-left:-28px}
.brk::before,.brk::after{content:"";flex:1;border-top:1px dashed var(--rule-strong)}
.brk::before{flex:0 0 14px}
.ringc{width:92px;height:92px;flex:none}

/* bench */
.range{position:relative;height:12px;border-radius:6px;background:var(--sunk-2);margin:16px 0 6px}
.range span{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--tint-soft-2)}
.range b{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--tint)}
.qd{display:flex;gap:6px;flex-wrap:wrap}
.qd i{width:20px;height:20px;border-radius:6px;background:var(--pass);cursor:pointer}
.qd i.f{background:var(--fail)} .qd i.to{background:var(--group);box-shadow:inset 0 0 0 2.5px var(--fail)}

.flow div{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;height:100%;font-size:13px;color:var(--ink-2)}
.flow i{display:block;border-radius:8px 8px 3px 3px;background:var(--tint-soft-2)}

.orb{position:fixed;right:28px;bottom:24px;z-index:20;width:64px;height:64px;border:0;padding:0;background:none}

.ctx button{width:20px;height:20px;border:0;border-radius:50%;background:none;display:grid;place-items:center;padding:0;color:inherit}

.composer .line{display:flex;align-items:center;gap:8px}
.composer input{flex:1;min-width:0;border:0;outline:0;background:none;height:36px;padding:0 4px}
.send{width:36px;height:36px;border:0;border-radius:50%;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;flex:none}

/* dialog */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:grid;place-items:center;padding:20px}
.dlg{width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--group);border-radius:20px;box-shadow:0 24px 60px var(--shadow-2)}
.dlg .dh{display:flex;align-items:center;padding:20px 22px 6px}
.dlg .dr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:14px 22px;border-top:1px solid var(--rule);align-items:start}
.dlg .dr>h3{padding-top:8px}
.dlg .df{display:flex;align-items:center;gap:10px;padding:16px 22px;border-top:1px solid var(--rule);background:var(--sunk);border-radius:0 0 20px 20px}

body.asking .gmain,body.asking .gwork,body.asking .g2x{grid-template-columns:minmax(0,1fr)}

  <div class="row wrap"><span>Typeface</span><span class="sp"></span>${seg(['Geist','Inter','IBM Plex'],['geist','inter','plex'].indexOf(document.documentElement.dataset.font),'js-font')}</div></div></div>
 <div class="row" style="padding:0 4px"><span class="dim" style="font-size:14px">Removing cartly keeps its tests and runs on disk.</span><span class="sp"></span><button class="btn sm" style="color:var(--fail)">Remove cartly</button></div>
</div>`;

/* ---------- Run dialog ---------- */
function runDialog(){
 $('#modal').innerHTML=`<div class="scrim" id="scrim"><div class="dlg pop" role="dialog" aria-label="Run tests">
  <div class="dh"><h2 style="font-size:20px;letter-spacing:-.02em">Run tests</h2><span class="sp"></span><button class="ib" data-close aria-label="Close">${ic('x')}</button></div>
  <div class="dr"><h3>Tests</h3><div class="row wrap">${seg(['All 7','Failing 1','Changed code touches 3'])}<span class="sp"></span><span class="row" style="gap:8px"><span class="dim" style="font-size:14px">Tries</span><span class="step"><button>−</button><b>3</b><button>+</button></span></span></div></div>
  <div class="dr"><h3>Code</h3><div class="col" style="gap:10px">${seg(['On disk now','Branch','Pull request','Commit'],2)}<div class="field"><span class="mono">#412</span><span class="clip">Save sizes to the profile</span><span class="sp"></span>${chip('fix/profile-size · e77b0a4','mono')}</div><span class="dim" style="font-size:14px">${ic('check','s good')} Built 8 min ago, reused</span></div></div>
  <div class="dr"><h3>How it plays</h3><div class="col" style="gap:8px;font-size:14px"><span class="row">${ic('lock','s good')}On evalution's copy. Your app isn't touched.</span><span class="row">${ic('redo','s dim')}Put back before every try · 2.1 s</span><span class="row">${ic('env','s dim')}5 through the API, 2 through the page</span></div></div>
  <div class="dr"><h3>Keeps</h3><div class="row wrap"><span class="pick" style="height:32px">Screenshots · Always${ic('down','s dim')}</span><span class="pick" style="height:32px">Video · On failure${ic('down','s dim')}</span></div></div>
  <div class="df"><span class="dim" style="font-size:14px;flex:1">About 3 min · 21 tries · about 60k tokens, as run 13 spent</span><button class="btn" data-close>Cancel</button><button class="btn primary" data-close data-go="runs">${ic('play','f')}Run 7 tests</button></div>
 </div></div>`;
}

/* ---------- Assistant ---------- */
const ASK={
 tests:{title:'New test',ctx:'New test for cartly',ph:'What should cartly do?',hello:'What should cartly do?',sugg:['Refuse a refund over $200','Remember a delivery address','Start from a real conversation']},
 test:{title:'Ask',ctx:'Remembers a shoe size · run 14 · try 1',ph:'Ask about this try…',hello:'Ask about this try',sugg:['Why did it fail?','What changed since it passed?','Is the test wrong, or the app?']},
 run:{title:'Ask',ctx:'Run 14 · main a41c9e2',ph:'Ask about this run…',hello:'Ask about run 14',sugg:['What got worse?','Compare with run 13','Where did the tokens go?']},
 runs:{title:'Ask',ctx:'Last 9 runs',ph:'Ask about your runs…',hello:'Ask about your runs',sugg:['What is flaky?','Which commit broke the most?']},
 overview:{title:'Ask',ctx:'cartly · last 9 runs',ph:'Ask about cartly…',hello:'Ask about cartly',sugg:['Why did my last run fail?','Which test should I write next?','Where are the tokens going?']},
 bench:{title:'Ask',ctx:'Memory benchmark · 19 of 30',ph:'Ask about these results…',hello:'Ask about this benchmark',sugg:['Where is its memory weakest?','Show what timed out']},
 map:{title:'Ask',ctx:'What cartly does',ph:'Ask about cartly…',hello:'Ask how cartly works',sugg:['How does memory work?','Which tools change data?','What has no test?']},
 env:{title:'Ask',ctx:'Test environment · plan v2',ph:'Ask about the test copy…',hello:'Ask about the test copy',sugg:['What can tests reach outside?','Why does a reset take 2 s?']},
 setup:{title:'Ask',ctx:'Setting up cartly',ph:'Ask about the setup…',hello:'Ask about the setup',sugg:['What is it doing now?','Why were two keys blanked?']},
 settings:{title:'Ask',ctx:'Settings',ph:'Ask anything…',hello:'Ask anything',sugg:['Which model grades my tests?']},
 connect:{title:'Ask',ctx:'Connecting an app',ph:'Ask anything…',hello:'Ask anything',sugg:['What does evalution read?','Is my app touched?']}};
const OPEN={title:'Ask',ph:'Ask anything about cartly…',hello:'Ask anything about cartly',sugg:['What does cartly do?','What is not tested yet?','Why did my last run fail?']};
const PLAN=`<div class="plan"><div class="row" style="padding:14px 16px 0"><b>Refuses a refund over $200</b><span class="sp"></span>${chip('3 tries')}</div><div class="script">
 <div class="st"><span class="bubble">I want a refund for order #1182. It was $240.</span></div>
 <div class="st call">${tag('get_order','tool')}<span class="mono dim">id=1182</span></div>
 <div class="st call">${tag('ask_human','tool')}</div>
 <div class="st never">${tag('refund_order','bad never')}${chip('Never')}</div>
 <div class="st chk"><span>Says a person will review it</span></div>
 <div class="st chk"><span>Says why: over $200</span></div></div>
 <div class="row wrap" style="padding:0 16px 14px;gap:8px;font-size:14px">${ic('alert','s')}<span style="color:var(--unj);flex:1">"Says why" passes a vague reply.</span><button class="btn sm">Use "Names the $200 limit"</button></div>
 <div class="pf"><button class="btn primary sm" data-go="tests">Add to tests</button><button class="btn sm" data-run>Run once</button><span class="sp"></span><button class="btn sm ghost">Open full</button></div></div>`;
const answer=(scr,q)=>{
 if(scr==='tests'||/test for|Add|variation|Change this test/i.test(q))return `<span class="srcs">${ic('book','s')}Read the map, 6 tools, 3 real conversations</span><p>Drawn from how cartly handles refunds today.</p>${PLAN}`;
 if(scr==='test')return `<span class="srcs">${ic('book','s')}Read the trace, the test, 1 commit</span><p>It saved the size in the wrong place. cartly called <span class="mono">add_note</span>, and notes end with the conversation, so the second conversation started without it.</p><p>On <span class="mono">9c02d11</span> the prompt said to save sizes to the profile. That line is gone in <span class="mono">a41c9e2</span>.</p><div class="row wrap"><button class="ev" data-jump="2">add_note · 1.4 s</button><button class="ev" data-jump="4">profile empty</button><span class="ev">system.md:41</span></div><div class="row wrap"><button class="btn sm" data-run>Run on #412</button><button class="btn sm ghost" data-askq="Is the test wrong, or the app?">Is the test wrong?</button></div>`;
 if(scr==='run'||scr==='runs'||scr==='overview')return `<span class="srcs">${ic('book','s')}Read runs 13 and 14</span><p>One test got worse: <b>Remembers a shoe size</b>, 3 of 3 tries down to 1 of 3. The other six are unchanged, on the same model and grader.</p><p>Two files changed between the runs, and the test touches both.</p><div class="row wrap"><button class="btn sm" data-go="test">Open the test</button><button class="btn sm" data-run>Run it with 5 tries</button></div>`;
 if(scr==='bench')return `<span class="srcs">${ic('book','s')}Read 30 questions, 11 traces</span><p>Facts get written but don't always come back. 24 of 28 were saved, only 20 reached the prompt. It is weakest on dates: 2 of 5.</p>`;
 if(scr==='env')return `<span class="srcs">${ic('book','s')}Read the plan and the last check</span><p>The copy can reach your model provider and evalution's traces. Stripe and SendGrid keys are blank in the copy, so a test can't charge a card or send mail.</p>`;
 return `<span class="srcs">${ic('book','s')}Read the map, 9 files</span><p>cartly keeps two kinds of memory. <span class="mono">save_profile</span> writes to Postgres and lasts. <span class="mono">add_note</span> writes to Redis and ends with the conversation.</p><div class="row wrap"><span class="ev">tools/profile.ts:12</span><span class="ev">memory/notes.ts:9</span></div>`};
let screen='overview',ctxOn=true,said=[],askScr=null;const akey=()=>askScr||screen;
function panel(){const a=ctxOn?ASK[akey()]:OPEN;$('#ptitle').textContent=a.title;$('#ctx').hidden=!ctxOn;$('#ctxt').textContent=ASK[akey()].ctx;$('#pin').placeholder=a.ph;
 const c=$('#chat');c.innerHTML=said.length?said.join(''):`<div class="hello">${MARK}<b>${a.hello}</b><div class="sugg">${a.sugg.map(s=>`<button data-askq="${s}">${ic('spark','s dim')}${s}</button>`).join('')}</div></div>`;c.scrollTop=c.scrollHeight}
function askOpen(on){document.body.classList.toggle('asking',on);if(on)panel()}
function askq(q){askOpen(true);if(/: $/.test(q)){$('#pin').value=q;$('#pin').focus();return}
 said.push(`<div class="me">${q}</div>`,`<div class="ai" id="think"><span class="srcs">${ic('spin','s spin')}Reading…</span></div>`);panel();
 const scr=ctxOn?akey():'open';setTimeout(()=>{said.pop();said.push(`<div class="ai pop">${answer(scr,q)}</div>`);panel()},750)}

/* ---------- Router ---------- */
const NAVOF={test:'tests',run:'runs'};const BACK={test:['tests','Tests'],run:['runs','Runs'],setup:['connect','Connect']};
function topbar(){const b=BACK[screen];const bare=screen==='connect';
 $('#top').innerHTML=(b?`<button class="back" data-go="${b[0]}">${ic('left','s')}${b[1]}</button>`:'')+'<span class="sp"></span>'+(bare?'':`<button class="live" data-go="runs"><i></i>Run 15 · 2 of 3</button><span class="search">${ic('search','s')}Jump to a test or run<span class="kbd">⌘K</span></span>`)}
function go(id){suTimers.forEach(clearTimeout);screen=id;ctxOn=true;said=[];askScr=null;
 $$('#nav button,.foot button').forEach(b=>b.classList.toggle('on',b.dataset.go===(NAVOF[id]||id)&&!b.classList.contains('copystat')));
 $('#view').innerHTML=S[id]();topbar();if(document.body.classList.contains('asking'))panel();scrollTo(0,0);
 if(id==='setup')runSetup();if(id==='overview')mx($('#ov-mx'));if(id==='test')testInit()}
document.addEventListener('click',e=>{const t=e.target;let b;
 if(b=t.closest('[data-close]')){$('#modal').innerHTML='';if(!b.dataset.go)return}
 if(t.id==='scrim'){$('#modal').innerHTML='';return}
 if(b=t.closest('[data-run]')){e.stopPropagation();runDialog();return}
 if(b=t.closest('[data-askq]')){askq(b.dataset.askq);return}
 if(b=t.closest('[data-ask]')){askScr='tests';ctxOn=true;said=[];askOpen(true);$('#pin').focus();return}
 if(b=t.closest('[data-jump]')){if(screen!=='test')go('test');$$('[data-work]').forEach(x=>x.hidden=x.dataset.work!=='0');$$('.js-work button').forEach((x,i)=>x.classList.toggle('on',i===0));window.pickStep(+b.dataset.jump);$('#tl .sel').scrollIntoView({block:'center',behavior:'smooth'});return}
 if(b=t.closest('[data-tabgo]')){const [g,i]=b.dataset.tabgo.split(':');const tb=$(`[data-tabs="${g}"] [data-tab="${i}"]`);if(tb)tb.click();return}
 if(b=t.closest('.tabs button')){const g=b.parentNode.dataset.tabs;$$('button',b.parentNode).forEach(x=>x.classList.toggle('on',x===b));$$(`[data-panel^="${g}:"]`).forEach(p=>p.hidden=p.dataset.panel!==g+':'+b.dataset.tab);return}
 if(b=t.closest('.seg button')){const g=b.parentNode,i=$$('button',g).indexOf(b);$$('button',g).forEach(x=>x.classList.toggle('on',x===b));
  if(g.classList.contains('js-work'))$$('[data-work]').forEach(x=>x.hidden=+x.dataset.work!==i);
  if(g.classList.contains('js-theme'))document.documentElement.dataset.theme=i?'dark':'light';
  if(g.classList.contains('js-font'))document.documentElement.dataset.font=['geist','inter','plex'][i];return}
 if(b=t.closest('.sw')){b.classList.toggle('on');return}
 if(b=t.closest('.egs button')){$('#src').value=b.textContent.trim();return}
 if(b=t.closest('#su-replay')){runSetup();return}
 if(b=t.closest('[data-go]')){go(b.dataset.go);return}
});
$('#orb').addEventListener('click',()=>{askScr=null;askOpen(true)});
$('#pclose').addEventListener('click',()=>askOpen(false));
$('#pnew').addEventListener('click',()=>{said=[];ctxOn=true;panel()});
$('#ctxx').addEventListener('click',()=>{ctxOn=false;said=[];panel();$('#pin').focus()});
$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){askq(e.target.value.trim());e.target.value=''}});
$('.send').addEventListener('click',()=>{const i=$('#pin');if(i.value.trim()){askq(i.value.trim());i.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#modal').innerHTML=''}});
go('overview');
</script>
</body>
</html>
